services:

  kafka1:
    image: apache/kafka:latest
    hostname: kafka1
    container_name: kafka1

    ports:
      - "29092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:19092,PLAINTEXT_HOST://localhost:29092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0


  kafka2:
    image: apache/kafka:latest
    hostname: kafka2
    container_name: kafka2

    ports:
      - "39092:9092"

    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:19092,PLAINTEXT_HOST://localhost:39092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0


  kafka3:
    image: apache/kafka:latest
    hostname: kafka3
    container_name: kafka3

    ports:
      - "49092:9092"

    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:19092,PLAINTEXT_HOST://localhost:49092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0


  kafka-init:
    image: apache/kafka:latest

    depends_on:
      - kafka1
      - kafka2
      - kafka3

    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-dados-sensores}

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        set -e

        echo "Aguardando os 3 brokers Kafka..."

        for broker in kafka1:19092 kafka2:19092 kafka3:19092; do
          until /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server "$$broker" \
            --list > /dev/null 2>&1
          do
            echo "Broker $$broker ainda indisponivel, aguardando..."
            sleep 3
          done
          echo "Broker $$broker disponivel."
        done

        echo "Criando topico $${KAFKA_TOPIC}..."

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka1:19092,kafka2:19092,kafka3:19092 \
          --create \
          --if-not-exists \
          --topic "$${KAFKA_TOPIC}" \
          --partitions 3 \
          --replication-factor 2

        echo "Topico pronto:"

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka1:19092,kafka2:19092,kafka3:19092 \
          --describe \
          --topic "$${KAFKA_TOPIC}"


  producer:
    build:
      context: ./producer

    env_file:
      - .env

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka1:19092,kafka2:19092,kafka3:19092

    restart: on-failure

    depends_on:
      kafka-init:
        condition: service_completed_successfully


  consumer:
    build:
      context: ./consumer

    env_file:
      - .env

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka1:19092,kafka2:19092,kafka3:19092

    restart: on-failure

    depends_on:
      kafka-init:
        condition: service_completed_successfully


  producer-2:
    build:
      context: ./producer

    env_file:
      - .env

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka1:19092,kafka2:19092,kafka3:19092
      SENSOR_ID: sensor-02

    restart: on-failure

    profiles:
      - sensores

    depends_on:
      kafka-init:
        condition: service_completed_successfully


  producer-3:
    build:
      context: ./producer

    env_file:
      - .env

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka1:19092,kafka2:19092,kafka3:19092
      SENSOR_ID: sensor-03

    restart: on-failure

    profiles:
      - sensores

    depends_on:
      kafka-init:
        condition: service_completed_successfully